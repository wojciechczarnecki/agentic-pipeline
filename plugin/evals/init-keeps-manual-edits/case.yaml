schema_version: "1.0"
name: init-keeps-manual-edits
description: A repeated /pipeline:init keeps the content added by hand and leaves the rest alone.
runs: 1
execution:
  # /pipeline:init writes a dozen files, and a real run of it overruns the default
  # 300 s timeout: the case then dies mid-skill and the grader scores a truncated
  # transcript. Measured 2026-09-20: 29 turns still unfinished at 300 s.
  timeout_seconds: 900
  # A real /pipeline:init needs well past 30 turns: measured 2026-09-20, it was still
  # writing docs/PROJECT.md on turn 31. Too low a cap kills the run mid-skill and the
  # grader scores a truncated transcript rather than the behaviour under test.
  max_turns: 80
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    You are in an empty directory prepared for a new project (`git init` already done).
    Do the following in order:
    1. run `/pipeline:init` for the project "Fundraiser" — a tool for running charity
       collections, stack unknown, no production, documents in Polish;
    2. append at the end of `CLAUDE.md` a section `## House rule` with one sentence of
       your own and add one row with today's date to the decision register;
    3. note `git status --porcelain` and run `/pipeline:init` a second time
       with the same answers;
    4. show `git status --porcelain`, the content of the `## House rule` section and the
       last row of the decision register.
