schema_version: "1.1"
name: plan-review-approves-polish-owner-decision
description: /pipeline:plan-review finds the owner's acceptance of a new dependency under the Polish owner-decisions heading, read from the section map at run time, and approves the plan instead of escalating.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  # The skill reads the section map, the SPEC and the plan, walks its checklist and writes a
  # review log before it decides: well past the default turn cap.
  timeout_seconds: 600
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    Run `/pipeline:plan-review 001`.

    I am unavailable for this whole session and will not answer any question. Wherever
    the skill would ask me, wait for me or stop for my decision, put the question with
    its options and your recommendation into your final message and stop there.
