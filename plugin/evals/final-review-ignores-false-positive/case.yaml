schema_version: "1.1"
name: final-review-ignores-false-positive
description: /pipeline:final-review in report mode does not report correct code that only looks unsafe.
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  # Report mode starts three review perspectives as subagents and then verifies every
  # finding itself: the longest of the stage-skill cases.
  timeout_seconds: 900
  max_turns: 60
  # Agent is how the skill starts its three perspectives.
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]
  prompt: |
    Run `/pipeline:final-review 001 report`.

    I am unavailable for this whole session and will not answer any question. Wherever
    the skill would ask me, wait for me or stop for my decision, put the question with
    its options and your recommendation into your final message and stop there.
