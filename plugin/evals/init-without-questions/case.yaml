schema_version: "1.0"
name: init-without-questions
description: Init without a way to ask a question finishes with success and leaves TODO markers.
runs: 1
execution:
  # /pipeline:init writes a dozen files, and a real run of it overruns the default
  # 300 s timeout: the case then dies mid-skill and the grader scores a truncated
  # transcript. Measured 2026-09-20: 29 turns still unfinished at 300 s.
  timeout_seconds: 900
  # A real /pipeline:init needs well past 30 turns: measured 2026-09-20, it was still
  # writing docs/PROJECT.md on turn 31. Too low a cap kills the run mid-skill and the
  # grader scores a truncated transcript rather than the behaviour under test.
  max_turns: 80
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  prompt: |
    Jesteś w pustym katalogu z `git init` i bez żadnych plików. Uruchom `/pipeline:init`.
    Nie odpowiem na żadne pytanie — pracujesz bez mojego udziału, więc dokończ zadanie sam
    i na koniec wypisz, co powstało i co zostało do uzupełnienia. Pokaż też pierwsze pięć
    linii `CLAUDE.md` i każdego pliku w `docs/` oraz wartość `language` zapisaną
    w `.claude/workflow.json` (albo, gdy `.claude/` nie dało się zapisać, wartość w treści
    wypisanej do wklejenia).
