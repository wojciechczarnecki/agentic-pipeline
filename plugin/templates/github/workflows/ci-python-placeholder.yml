# CI for a Python layer that has no tests or dev tools yet: the job passes, so the required
# check exists from the first push. `init` renders this file like ci-python.yml (a line that
# ends in a layer marker comment belongs to one form only).
# The job name is the required check in the repository ruleset
# (`.github/repository/ruleset.json`): renaming the job means renaming it there and on GitHub.
# Once the layer declares ruff and pytest and has a test file, replace the echo step with the
# commented steps below (the real job of ci-python.yml) and delete this comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  <layer>:
    runs-on: ubuntu-latest
    defaults:  # subdirectory layer
      run:  # subdirectory layer
        working-directory: <dir>  # subdirectory layer

    steps:
