# CI for a Python project managed with uv. Job for the detected Python stack; combine it
# with ci-node.yml when the repository carries both. If the project lives in a
# subdirectory, add `defaults: { run: { working-directory: <dir> } }` to the job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

      - name: Run tests
        run: uv run pytest -q
