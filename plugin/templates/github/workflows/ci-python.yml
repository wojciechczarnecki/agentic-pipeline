# CI for a Python project managed with uv. `init` renders this file once per Python layer:
# a line that ends in a layer marker comment belongs to one form only, and the job name and
# the directory are filled in by the skill. Combine it with ci-node.yml when the repository
# carries both.
# The job name is the required check in the repository ruleset
# (`.github/repository/ruleset.json`): renaming the job means renaming it there and on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  <layer>:
    runs-on: ubuntu-latest
    defaults:  # subdirectory layer
      run:  # subdirectory layer
        working-directory: <dir>  # subdirectory layer

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:  # subdirectory layer
          working-directory: <dir>  # subdirectory layer

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with black
        run: uv run black --check .

      - name: Run tests
        run: uv run pytest -q
