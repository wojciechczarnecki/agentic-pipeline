# CI for a Node project. `init` renders this file once per Node layer: a line that ends in a
# layer marker comment belongs to one form only, and the job name and the directory are
# filled in by the skill. Combine it with ci-python.yml when the repository carries both.
# The job name is the required check in the repository ruleset
# (`.github/repository/ruleset.json`): renaming the job means renaming it there and on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  <layer>:
    runs-on: ubuntu-latest
    defaults:  # subdirectory layer
      run:  # subdirectory layer
        working-directory: <dir>  # subdirectory layer

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json  # root layer
          cache-dependency-path: <dir>/package-lock.json  # subdirectory layer

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
