# CI for a Node layer that has no lint or test scripts and no tests yet: the job passes, so
# the required check exists from the first push. `init` renders this file like ci-node.yml
# (a line that ends in a layer marker comment belongs to one form only).
# The job name is the required check in the repository ruleset
# (`.github/repository/ruleset.json`): renaming the job means renaming it there and on GitHub.
# Once the layer has lint and test scripts and a test file, replace the echo step with the
# commented steps below (the real job of ci-node.yml) and delete this comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  <layer>:
    runs-on: ubuntu-latest
    defaults:  # subdirectory layer
      run:  # subdirectory layer
        working-directory: <dir>  # subdirectory layer

    steps:
