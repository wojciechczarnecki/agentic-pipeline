version: 2

# Monthly, grouped minor/patch updates only. Major versions are upgraded deliberately as
# their own task (they usually need coordinated changes across several packages); known
# vulnerabilities are caught independently by the weekly audit in the security workflow.
# Keep the ecosystems this repository actually uses, one entry per layer with `<dir>` filled in
# by `init` (the layer's directory, nothing for the root); `github-actions` stays either way.
updates:
  - package-ecosystem: uv
    directory: /<dir>
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /<dir>
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      node-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
