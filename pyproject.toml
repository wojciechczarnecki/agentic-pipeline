[project]
name = "agentic-pipeline"
# Required by [project] even though the package is never built; the plugin's own version
# lives solely in plugin/.claude-plugin/plugin.json and this field does not track it.
version = "0"
description = "Agentic feature pipeline plugin for Claude Code"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["plugin/tests", "tests"]
