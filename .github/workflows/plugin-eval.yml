name: Plugin eval

# Manual only. `claude plugin eval` runs a real model: it costs money, its score varies
# between runs and it needs an API key in the repository secrets — none of which belongs
# in a gate on every pull request. The blocking gates are `claude plugin validate --strict`
# and the plugin test suite, both in the `plugin` job of ci.yml.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Run the plugin eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin eval plugin/ --trust-plugin --no-publish

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-eval-results
          path: plugin/evals/results
          retention-days: 14
          if-no-files-found: warn
