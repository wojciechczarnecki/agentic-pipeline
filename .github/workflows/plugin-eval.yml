name: Plugin eval

# Manual only. `claude plugin eval` runs a real model: it costs money, its score varies
# between runs and it needs an API key in the repository secrets — none of which belongs
# in a gate on every pull request. The blocking gates are `claude plugin validate --strict`
# and the plugin test suite, both in the `plugin` job of ci.yml.
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The eval grants Bash, and a granted shell tool is refused outright unless the
      # run can be confined: "sandbox required but unavailable ... refusing to start
      # without a working sandbox". The runner image is not guaranteed to carry the
      # backend, and the failure is silent in the worst way — every run reports turns: 0
      # and the LLM grader still votes FAIL on the empty transcript, so the suite scores
      # zero as though the plugin were broken.
      - name: Install the sandbox backend
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Run the plugin eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --trust-plugin implies none of the grants below, so each one is spelled out:
        # --scaffold lets init-question-cap write the pyproject.toml its stack detection
        # needs, and --allow-tools grants the gated tools the cases declare — Bash (all
        # four) so the guard case's PreToolUse:Bash hook can actually fire, Write/Edit
        # (three) so /pipeline:init can write files. Trimming Bash would leave the guard
        # case scoring the model's own reluctance instead of the hook, and still green.
        run: >
          claude plugin eval plugin/
          --trust-plugin
          --scaffold
          --allow-tools Bash Write Edit
          --no-publish

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-eval-results
          path: plugin/evals/results
          retention-days: 14
          if-no-files-found: warn
